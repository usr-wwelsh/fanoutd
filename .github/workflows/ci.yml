name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The agent's shell tool runs inside bwrap. Without it the sandbox tests
      # skip themselves, and the jail that keeps a model off the host would go
      # unexercised — which is the one part of this that must not.
      #
      # Installing the binary is not enough: Ubuntu 24.04 ships an AppArmor
      # profile that denies unprivileged user namespaces, so bwrap is present
      # and every jail it tries to build fails. Lifting the restriction is what
      # makes the runner behave like the machines fanoutd actually runs on.
      - name: Install bubblewrap
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --ro-bind / / /bin/true && echo "bwrap builds a jail"

      # gofmt drifted unnoticed once already, and ten permanently-dirty files
      # hide the eleventh. Fail here so the alarm stays worth listening to.
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # FANOUT_REQUIRE_SANDBOX makes the sandbox tests fail rather than skip.
      # The runner was just set up to build a jail; if it cannot, that is a
      # broken assumption to hear about, not to skip past.
      - name: Test
        env:
          FANOUT_REQUIRE_SANDBOX: "1"
        run: go test -race ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Build
        run: bun run build
